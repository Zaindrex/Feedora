<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230F917D'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Feedora - Turn Every Customer Experience Into Genuine, Meaningful Google Reviews." />
    <meta property="og:title" content="Feedora — Smart QR Experience & Review Flow" />
    <meta property="og:description" content="Help delighted customers craft natural reviews from authentic feedback and share directly to Google." />
    <meta name="theme-color" content="#0F917D" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <title>Feedora | Turn Customer Experience Into Genuine Reviews</title>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans antialiased selection:bg-[#ccfbf1] selection:text-[#0f6458]">
    <div id="root"></div>
    <script>
      (function (location) {
        if (location.search[1] === '/') {
          var decoded = location.search.slice(1).split('&').map(function (part) {
            return part.replace(/~and~/g, '&');
          });
          var route = decoded.shift();
          var query = decoded.length ? '?' + decoded.join('&') : '';
          window.history.replaceState(null, '', location.pathname.replace(/\/$/, '') + route + query + location.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
